<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Exercise Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .test-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .test-info {
            text-align: center;
        }
        .test-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .test-url {
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            text-align: center;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 Test Exercise Images</h1>
    <div id="status" class="status">Testing images...</div>
    
    <div class="test-container" id="testContainer">
        <!-- Images will be loaded here -->
    </div>

    <script>
        const testImages = [
            {
                name: "Waist Exercise",
                bodyPart: "waist",
                url: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400&h=300&fit=crop&auto=format"
            },
            {
                name: "Chest Exercise", 
                bodyPart: "chest",
                url: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=400&h=300&fit=crop&auto=format"
            },
            {
                name: "Back Exercise",
                bodyPart: "back", 
                url: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=400&h=300&fit=crop&auto=format"
            },
            {
                name: "Legs Exercise",
                bodyPart: "legs",
                url: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400&h=300&fit=crop&auto=format"
            }
        ];

        let loadedCount = 0;
        let errorCount = 0;

        function updateStatus() {
            const total = testImages.length;
            const statusEl = document.getElementById('status');
            
            if (loadedCount + errorCount === total) {
                if (errorCount === 0) {
                    statusEl.innerHTML = `✅ All ${total} images loaded successfully!`;
                    statusEl.className = 'status success';
                } else {
                    statusEl.innerHTML = `⚠️ ${loadedCount}/${total} images loaded, ${errorCount} failed`;
                    statusEl.className = 'status error';
                }
            } else {
                statusEl.innerHTML = `Loading... ${loadedCount + errorCount}/${total}`;
            }
        }

        function createTestCard(imageData) {
            const card = document.createElement('div');
            card.className = 'test-card';
            
            const img = document.createElement('img');
            img.className = 'test-image';
            img.alt = imageData.name;
            
            const info = document.createElement('div');
            info.className = 'test-info';
            
            const title = document.createElement('div');
            title.className = 'test-title';
            title.textContent = imageData.name;
            
            const url = document.createElement('div');
            url.className = 'test-url';
            url.textContent = imageData.url;
            
            img.onload = () => {
                loadedCount++;
                updateStatus();
            };
            
            img.onerror = () => {
                errorCount++;
                updateStatus();
                card.style.border = '2px solid #dc3545';
            };
            
            img.src = imageData.url;
            
            info.appendChild(title);
            info.appendChild(url);
            card.appendChild(img);
            card.appendChild(info);
            
            return card;
        }

        // Load test images
        testImages.forEach(imageData => {
            const card = createTestCard(imageData);
            document.getElementById('testContainer').appendChild(card);
        });
    </script>
</body>
</html>
