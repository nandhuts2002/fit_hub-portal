<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
        // Redirect all 404s to index.html for client-side routing
        sessionStorage.setItem('redirect', window.location.pathname + window.location.search + window.location.hash);
        window.location.href = '/';
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
