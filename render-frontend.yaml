services:
  - type: web
    name: fithub-frontend
    env: static
    buildCommand: cd client && npm install --legacy-peer-deps && npm run build && echo "Build complete. Checking _redirects file..." && ls -la build/ && cat build/_redirects || echo "_redirects file not found in build directory"
    staticPublishPath: ./client/build
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_API_BASE_URL
        sync: false
      - key: REACT_APP_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
