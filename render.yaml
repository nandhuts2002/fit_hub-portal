services:
  # Flask Backend API Only
  - type: web
    name: fithub-api
    runtime: python
    buildCommand: |
      echo "Starting API build process..." &&
      pip install -r requirements.txt && 
      echo "Python dependencies installed" &&
      echo "API build completed successfully"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        value: mongodb+srv://nandhuts:Allmight%40123@fithub.dytvvnq.mongodb.net/fithub?retryWrites=true&w=majority&appName=fithub
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: RAPIDAPI_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      # SMTP Configuration for email delivery
      - key: SMTP_HOST
        value: 'smtp.sendgrid.net'
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        value: 'apikey'
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Development mode for email debugging
      - key: EMAIL_DEV_MODE
        value: 'true'
      # Frontend URL for CORS
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /
    autoDeploy: true

  # React Frontend Web Service (using serve for SPA support)
  - type: web
    name: fithub-frontend
    env: node
    buildCommand: cd client && npm install --legacy-peer-deps && npm run build
    startCommand: cd client && npx serve -s build -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_API_BASE_URL
        sync: false
