services:
  # Combined Flask Backend + React Frontend
  - type: web
    name: fithub-portal
    runtime: python
    buildCommand: |
      pip install -r requirements.txt && 
      python test_mongo.py && 
      cd client && 
      npm install --legacy-peer-deps && 
      npm run build
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.17.0
      - key: MONGO_URI
        value: mongodb+srv://nandhuts:Allmight%40123@fithub.dytvvnq.mongodb.net/fithub?retryWrites=true&w=majority&appName=fithub
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: RAPIDAPI_KEY
        sync: false
      - key: FLASK_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
