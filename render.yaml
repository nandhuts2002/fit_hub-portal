services:
  # Flask Backend API Only
  - type: web
    name: fithub-api
    runtime: python
    buildCommand: |
      echo "Starting API build process..." &&
      pip install -r requirements.txt && 
      echo "Python dependencies installed" &&
      python test_mongo.py && 
      echo "MongoDB test passed" &&
      echo "API build completed successfully"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        value: mongodb+srv://nandhuts:Allmight%40123@fithub.dytvvnq.mongodb.net/fithub?retryWrites=true&w=majority&appName=fithub
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: RAPIDAPI_KEY
        sync: false
      - key: FLASK_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
